name: Build Realme GT Neo5 SE Kernel (GKI 5.10)
run-name: ${{ inputs.ksu_type }}${{ inputs.SUSFS && ' + SuSFS' || '' }} — GT Neo5 SE (5.10)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ksu_type }}-${{ inputs.SUSFS }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        type: choice
        description: "Kernel Source Base"
        required: true
        default: "realme_stock"
        options:
          - "realme_stock"
          - "google_common_5_10"

      merge_google_upstream:
        description: "Merge latest Google android12-5.10 into Realme tree (only for realme_stock)"
        required: true
        type: boolean
        default: true

      lto:
        type: choice
        description: "LTO mode (thin = CFI kept, like stock; none = least RAM, CFI off)"
        required: true
        default: "thin"
        options:
          - "thin"
          - "none"

      ksu_type:
        description: "Root solution"
        required: true
        type: choice
        default: "ReSukiSU"
        options:
          - "ReSukiSU"
          - "KernelSU Next"

      SUSFS:
        description: "Enable SuSFS (hide environment)"
        required: true
        type: boolean
        default: true

      bbr_enable:
        description: "TCP BBR Congestion Control"
        required: true
        type: choice
        default: "default"
        options:
          - "false"
          - "true"
          - "default"

      wireguard:
        description: "WireGuard VPN support"
        required: true
        type: boolean
        default: true

      ip_set_enable:
        description: "IP_SET support"
        required: true
        type: boolean
        default: true

      ttl_enable:
        description: "TTL / Hop Limit target support"
        required: true
        type: boolean
        default: true

      release:
        type: choice
        description: "Create GitHub Release"
        required: true
        default: "Test"
        options:
          - "Release"
          - "Test"

env:
  TZ: Asia/Shanghai
  SUSFS_VERSION: "v1.5.12"
  AOSP_CLANG_VERSION: "clang-r416183b"
  GOOGLE_COMMON_REPO: "https://android.googlesource.com/kernel/common"
  GOOGLE_COMMON_BRANCH: "android12-5.10-2025-05"   # 5.10.236-android12, как на устройстве
  GOOGLE_BASE_TAG_PREFIX: "android12-5.10-2025-05_r"   # релизные теги Google, 5.10.236 (база Realme)
  GOOGLE_UPSTREAM_BRANCH: "android12-5.10"       # актуальный tip Google
  REALME_STOCK_REPO: "https://github.com/realme-kernel-opensource/realme_GTNeo5SE-AndroidB-kernel-source.git"
  REALME_STOCK_BRANCH: "master"   # 5.10.236, RMX3700 16.0.1.301

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fast Disk Cleanup & Swap Check
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell 2>/dev/null || true
          
          # Выделяем гарантированные 8GB Swap через dd
          if ! swapon --show | grep -q "/swapfile_extra"; then
            echo "Создание дополнительного swap-файла..."
            sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=8192 status=none || true
            sudo chmod 600 /swapfile_extra || true
            sudo mkswap /swapfile_extra || true
            sudo swapon /swapfile_extra || true
          fi
          free -h
          df -h

      - name: Install Essential Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git libelf-dev libssl-dev \
            python3 zip libarchive-tools pahole tar xz-utils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download & Setup Google AOSP Clang
        run: |
          mkdir -p ~/clang
          cd ~/clang
          GOOGLE_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/${AOSP_CLANG_VERSION}.tar.gz"
          MIRROR_URL="https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/v1.0.0/${AOSP_CLANG_VERSION}.tar.gz"

          echo "Downloading AOSP Clang..."
          if ! curl -fSL --retry 3 --connect-timeout 20 "$GOOGLE_URL" -o clang.tar.gz; then
            echo "Google Git archive failed, downloading from GitHub mirror..."
            curl -fSL --retry 3 --connect-timeout 20 "$MIRROR_URL" -o clang.tar.gz
          fi
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz
          echo "$HOME/clang/bin" >> $GITHUB_PATH
          echo "Clang version:"
          ~/clang/bin/clang --version

      - name: Clone Kernel Source
        run: |
          if [[ "${{ inputs.kernel_source }}" == "realme_stock" ]]; then
            echo "Cloning Realme official kernel tree..."
            git clone --depth=1 -b "${REALME_STOCK_BRANCH}" "${REALME_STOCK_REPO}" ~/kernel
            grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" ~/kernel/Makefile
          else
            echo "Cloning Google Common Kernel (${GOOGLE_COMMON_BRANCH})..."
            git clone --depth=1 -b "${GOOGLE_COMMON_BRANCH}" "${GOOGLE_COMMON_REPO}" ~/kernel
          fi

      - name: Merge latest Google upstream into Realme tree
        if: inputs.kernel_source == 'realme_stock' && inputs.merge_google_upstream
        run: |
          set -euo pipefail
          cd ~/kernel
          echo "Realme base before merge:"; grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" Makefile | tr '\n' ' '; echo
          git config user.name "ci"; git config user.email "ci@localhost"
          git config merge.renames false
          fetch_ref() { # $1 = полный ref (refs/heads/... или refs/tags/...), $2 = локальное имя
            for i in 1 2 3; do
              git fetch --depth=1 --no-tags "$GOOGLE_COMMON_REPO" "$1:refs/google/$2" && return 0
              sleep 10
            done
            return 1
          }

          # База: релизные теги android12-5.10-2025-05_rN (все 5.10.236). Берём первый найденный.
          BASE_FOUND=""
          for n in 8 9 7 6 5 4 3 2 1; do
            if git fetch --depth=1 --no-tags "$GOOGLE_COMMON_REPO" \
                 "refs/tags/${GOOGLE_BASE_TAG_PREFIX}${n}:refs/google/base" 2>/dev/null; then
              BASE_FOUND="${GOOGLE_BASE_TAG_PREFIX}${n}"; break
            fi
          done
          if [[ -z "$BASE_FOUND" ]]; then
            echo "::error::None of the tags ${GOOGLE_BASE_TAG_PREFIX}{1..9} found in ${GOOGLE_COMMON_REPO}"
            exit 1
          fi
          echo "Google base tag: ${BASE_FOUND}"
          fetch_ref "refs/heads/${GOOGLE_UPSTREAM_BRANCH}" tip
          echo "Google base version:"; git show refs/google/base:Makefile | grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" | tr '\n' ' '; echo
          echo "Google tip version:";  git show refs/google/tip:Makefile  | grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" | tr '\n' ' '; echo
          BASE=$(git commit-tree "refs/google/base^{tree}" -m "google base")
          THEIRS=$(git commit-tree "refs/google/tip^{tree}" -p "$BASE" -m "google tip")
          OURS=$(git commit-tree "HEAD^{tree}" -p "$BASE" -m "realme")
          git checkout -q -B merged "$OURS"
          set +e
          git merge --no-edit -X ours "$THEIRS" > $RUNNER_TEMP/merge.log 2>&1
          rc=$?
          set -e
          mapfile -t UNMERGED < <(git diff --name-only --diff-filter=U)
          for f in "${UNMERGED[@]}"; do
            [[ -n "$f" ]] || continue
            if git checkout --ours -- "$f" 2>/dev/null; then git add -- "$f"; else git rm -q --cached -- "$f" 2>/dev/null || true; rm -f -- "$f"; fi
          done
          if [[ -f .git/MERGE_HEAD ]]; then git commit -q --no-edit; fi
          echo "merge rc=$rc, unmerged-resolved=${#UNMERGED[@]}"
          if ! git merge-base --is-ancestor "$THEIRS" HEAD; then
            echo "::error::Google upstream merge failed (not an ancestor of HEAD):"
            cat "$RUNNER_TEMP/merge.log"
            exit 1
          fi
          git diff --shortstat "$OURS" HEAD

          echo "=== Merge log (tail) ==="; tail -n 40 "$RUNNER_TEMP/merge.log" || true
          echo "Kernel version after merge:"; grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" Makefile | tr '\n' ' '; echo
          {
            echo "### Google upstream merge"
            echo "- base: \`${BASE_FOUND}\` → upstream: \`${GOOGLE_UPSTREAM_BRANCH}\`"
            echo "- conflicting paths resolved in favour of Realme (--ours): ${#UNMERGED[@]}"
            printf '%s\n' "${UNMERGED[@]:0:50}" | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Root Solution (KernelSU / ReSukiSU)
        run: |
          cd ~/kernel
          if [[ "${{ inputs.ksu_type }}" == "ReSukiSU" ]]; then
            echo "Setting up ReSukiSU..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          else
            echo "Setting up KernelSU Next..."
            if [[ "${{ inputs.SUSFS }}" == "true" ]]; then
              git clone --depth=1 -b dev-susfs https://github.com/pershoot/KernelSU-Next.git KernelSU-Next
            else
              git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
            fi
            ln -sfn "$(realpath KernelSU-Next/kernel)" drivers/kernelsu || true
            grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
            grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: Integrate SuSFS (Kernel Side)
        if: inputs.SUSFS
        run: |
          cd ~/kernel
          echo "Cloning SuSFS for android12-5.10..."
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ~/susfs4ksu

          # 1. Копируем заголовки и исходники SuSFS в ядро
          cp -rf ~/susfs4ksu/kernel_patches/fs/* fs/
          cp -rf ~/susfs4ksu/kernel_patches/include/linux/* include/linux/

          # 2. Применяем патч только к ядру (ReSukiSU и dev-susfs уже содержат свой код SuSFS)
          if [[ -f ~/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ]]; then
            patch -p1 --forward --batch < ~/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true
          fi

          # Патч SuSFS сделан под tip ветки; на более старой базе возможны отказы (.rej)
          if find . -name '*.rej' | grep -q .; then
            echo "::warning::SuSFS patch has rejected hunks on this kernel base:"
            find . -name '*.rej'
          fi

      - name: Apply Realme GT Neo5 SE Patches (if present)
        run: |
          cd ~/kernel
          if [[ -d "${GITHUB_WORKSPACE}/patches" ]]; then
            for p in "${GITHUB_WORKSPACE}"/patches/*.patch; do
              [[ -f "$p" ]] || continue
              echo "Applying $p..."
              patch -p1 --forward --batch < "$p" || true
            done
          fi

      - name: Configure Defconfig for Realme GT Neo5 SE
        run: |
          cd ~/kernel
          DEFCONFIG_NAME="gki_defconfig"
          if [[ "${{ inputs.kernel_source }}" == "realme_stock" ]]; then
            # Как в стоковой сборке Qualcomm/Realme: gki_defconfig + vendor/waipio_GKI.config
            cat arch/arm64/configs/gki_defconfig arch/arm64/configs/vendor/waipio_GKI.config \
              > arch/arm64/configs/waipio-gki_defconfig
            DEFCONFIG_NAME="waipio-gki_defconfig"
          fi
          echo "DEFCONFIG_NAME=${DEFCONFIG_NAME}" >> "$GITHUB_ENV"
          DEFCONFIG="arch/arm64/configs/${DEFCONFIG_NAME}"

          add_cfg() {
            local key="$1" value="$2"
            sed -i "/^${key}=/d" "$DEFCONFIG" 2>/dev/null || true
            sed -i "/^# ${key} is not set/d" "$DEFCONFIG" 2>/dev/null || true
            echo "${key}=${value}" >> "$DEFCONFIG"
          }

          # Обязательные атрибуты файловой системы для RealmeUI / ColorOS
          add_cfg CONFIG_TMPFS_XATTR y
          add_cfg CONFIG_TMPFS_POSIX_ACL y
          add_cfg CONFIG_LOCALVERSION "\"-GT-Neo5-SE\""

          # Отключаем строгую валидацию KMI ABI для загрузки вендорных драйверов Realme
          add_cfg CONFIG_KMI_SYMBOL_LIST_STRICT_MODE n

          # Full LTO в gki_defconfig не влезает в память раннера (OOM при линковке vmlinux).
          # thin: сохраняем CFI/SCS, как в стоке; none: минимум памяти, но CFI отключается.
          sed -i '/^CONFIG_LTO_CLANG_FULL=/d; /^CONFIG_LTO_CLANG_THIN=/d; /^CONFIG_LTO_NONE=/d; /^# CONFIG_LTO_/d' "$DEFCONFIG"
          if [[ "${{ inputs.lto }}" == "thin" ]]; then
            add_cfg CONFIG_LTO_CLANG_THIN y
          else
            add_cfg CONFIG_LTO_NONE y
          fi

          # KSU опции
          add_cfg CONFIG_KSU y
          if [[ "${{ inputs.ksu_type }}" == "KernelSU Next" ]]; then
            add_cfg CONFIG_KSU_MANUAL_HOOK y
            add_cfg CONFIG_KSU_KPROBES_HOOK n
          fi

          # SuSFS опции
          if [[ "${{ inputs.SUSFS }}" == "true" ]]; then
            for opt in \
              CONFIG_KSU_SUSFS=y \
              CONFIG_KSU_SUSFS_SUS_PATH=y \
              CONFIG_KSU_SUSFS_SUS_MOUNT=y \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y \
              CONFIG_KSU_SUSFS_SUS_KSTAT=y \
              CONFIG_KSU_SUSFS_TRY_UMOUNT=y \
              CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y \
              CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
              CONFIG_KSU_SUSFS_ENABLE_LOG=y \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
              CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
              CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y \
              CONFIG_KSU_SUSFS_SUS_SU=n
            do
              add_cfg "${opt%%=*}" "${opt#*=}"
            done
          fi

          # Сетевые настройки (BBR, WireGuard, IP_SET, TTL)
          if [[ "${{ inputs.bbr_enable }}" != "false" ]]; then
            add_cfg CONFIG_TCP_CONG_ADVANCED y
            add_cfg CONFIG_TCP_CONG_BBR y
            add_cfg CONFIG_NET_SCH_FQ y
            add_cfg CONFIG_NET_SCH_FQ_CODEL y
            [[ "${{ inputs.bbr_enable }}" == "default" ]] && add_cfg CONFIG_DEFAULT_TCP_CONG "\"bbr\""
          fi

          if [[ "${{ inputs.wireguard }}" == "true" ]]; then
            add_cfg CONFIG_WIREGUARD y
          fi

          if [[ "${{ inputs.ip_set_enable }}" == "true" ]]; then
            add_cfg CONFIG_IP_SET y
            add_cfg CONFIG_IP_SET_HASH_IP y
            add_cfg CONFIG_IP_SET_HASH_NET y
          fi

          if [[ "${{ inputs.ttl_enable }}" == "true" ]]; then
            add_cfg CONFIG_IP_NF_TARGET_TTL y
            add_cfg CONFIG_IP6_NF_TARGET_HL y
          fi

          sed -i 's/check_defconfig//g' build.config* 2>/dev/null || true

      - name: Build Kernel Image
        run: |
          cd ~/kernel
          export PATH="$HOME/clang/bin:$PATH"

          echo "Generating defconfig..."
          make -j$(nproc --all) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            "${DEFCONFIG_NAME}"

          if [[ "${{ inputs.lto }}" == "thin" ]]; then
            ./scripts/config -d LTO_CLANG_FULL -d LTO_NONE -e LTO_CLANG_THIN
          else
            ./scripts/config -d LTO_CLANG_FULL -d LTO_CLANG_THIN -e LTO_NONE \
                             -d CFI_CLANG -d CFI_PERMISSIVE
          fi
          make -j$(nproc --all) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "=== LTO/CFI/SCS state in final .config ==="
          grep -E "^(# )?CONFIG_(LTO|CFI|SHADOW_CALL_STACK)" .config || true
          if grep -q "^CONFIG_LTO_CLANG_FULL=y" .config; then
            echo "::error::Full LTO is still enabled (OOM risk at vmlinux link)"
            exit 1
          fi
          free -h

          echo "Compiling Kernel (Image)..."
          make -j$(nproc --all) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image

          if [[ ! -f "arch/arm64/boot/Image" ]]; then
            echo "::error::Kernel Image was not generated!"
            exit 1
          fi
          echo "Kernel compiled successfully!"

      - name: Package with AnyKernel3 (Realme GT Neo5 SE)
        id: package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3

          # Конфигурация AnyKernel3 под Realme GT Neo5 SE (A/B, GKI boot.img)
          # Поддерживаются и верхний (BLOCK=), и нижний (block=) регистр ключей
          sed -i -E 's|^(BLOCK\|block)=.*|\1=boot;|'                       anykernel.sh
          sed -i -E 's|^(IS_SLOT_DEVICE\|is_slot_device)=.*|\1=auto;|'     anykernel.sh
          sed -i -E 's|^(RAMDISK_COMPRESSION\|ramdisk_compression)=.*|\1=auto;|' anykernel.sh
          sed -i -E 's|^(PATCH_VBMETA_FLAG\|patch_vbmeta_flag)=.*|\1=auto;|' anykernel.sh

          # Проверку устройства отключаем: кодовые имена модели могут не совпасть
          sed -i -E 's|^do\.devicecheck=.*|do.devicecheck=0|'  anykernel.sh
          sed -i -E 's|^do\.modules=.*|do.modules=0|'          anykernel.sh
          sed -i -E 's|^kernel\.string=.*|kernel.string=GT Neo5 SE GKI 5.10 (${{ inputs.ksu_type }})|' anykernel.sh

          echo "=== anykernel.sh properties ==="
          grep -nE "^(BLOCK|block|IS_SLOT_DEVICE|is_slot_device|RAMDISK_COMPRESSION|ramdisk_compression|PATCH_VBMETA_FLAG|patch_vbmeta_flag|do\.|kernel\.string)" anykernel.sh || true
          if ! grep -qE "^(BLOCK|block)=boot;" anykernel.sh; then
            echo "::error::Failed to set boot partition in anykernel.sh"
            exit 1
          fi

          cp ~/kernel/arch/arm64/boot/Image ./Image

          KSU_TAG="$(echo "${{ inputs.ksu_type }}" | tr ' ' '_')"
          ZIP_NAME="AnyKernel3_GT_Neo5_SE_5.10_${KSU_TAG}${{ inputs.SUSFS && '_SUSFS' || '' }}_$(date +%Y%m%d_%H%M).zip"
          zip -r9 "$ZIP_NAME" ./* -x .git README.md anykernel.sh.orig

          mkdir -p "${GITHUB_WORKSPACE}/out"
          cp "$ZIP_NAME" "${GITHUB_WORKSPACE}/out/"
          cp ./Image "${GITHUB_WORKSPACE}/out/Image"

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "📦 Archive created: $ZIP_NAME"

      - name: Upload AnyKernel3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: out/*.zip

      - name: Upload Raw Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-GT-Neo5-SE
          path: out/Image

      - name: Create GitHub Release
        if: inputs.release == 'Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.package.outputs.zip_name }}
          name: GT Neo5 SE 5.10 (${{ inputs.ksu_type }}${{ inputs.SUSFS && ' + SuSFS' || '' }})
          files: out/*.zip
          body: |
            ### Realme GT Neo5 SE (RMX3700 / SM7475) GKI 5.10
            - **Base**: Android Common Kernel (`android12-5.10`)
            - **Compiler**: Google AOSP Clang (`clang-r416183b`)
            - **Root Solution**: ${{ inputs.ksu_type }}
            - **SuSFS**: ${{ inputs.SUSFS }} (${{ env.SUSFS_VERSION }})
            - **BBR**: ${{ inputs.bbr_enable }}
            - **WireGuard**: ${{ inputs.wireguard }}
            - **Flasher**: AnyKernel3 (прошивать через KernelFlasher, TWRP или OrangeFox)