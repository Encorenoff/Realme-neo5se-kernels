name: Build Realme GT Neo5 SE Kernel
run-name: ${{ inputs.ksu_type }}${{ inputs.SUSFS && ' + SuSFS' || '' }} — GT Neo5 SE (5.10)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ksu_type }}-${{ inputs.SUSFS }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  SUSFS_VERSION: 'v1.5.12'
  RETENTION_COUNT: 5
  GOOGLE_COMMON_REPO: 'https://android.googlesource.com/kernel/common'
  REALME_NEO5SE_KERNEL: 'https://github.com/realme-kernel-opensource/realme_GTneo5SE_5G-AndroidU-kernel-source.git'
  GOOGLE_5_10_DEFAULT: 'android15-5.10'
  TARGET_PLATFORM: 'sm7475'

on:
  workflow_dispatch:
    inputs:
      run_mode:
        type: choice
        description: "Where to build"
        required: true
        default: "github"
        options:
          - github
          - local
          - local_clear

      android_release:
        type: choice
        description: "Android/GKI line (Google 5.10 branch)"
        required: true
        default: "android15"
        options:
          - "android12"
          - "android13"
          - "android14"
          - "android15"
          - "android16"

      kernel_source:
        type: choice
        description: "Kernel base"
        required: true
        default: "google_5_10_realme"
        options:
          - "google_5_10_realme"
          - "realme_stock"

      google_kernel_ref:
        type: string
        description: "Google common-kernel ref (leave 'latest' to follow androidXX-5.10)"
        required: true
        default: "latest"

      ksu_type:
        description: "Root solution"
        required: true
        type: choice
        default: "ReSukiSU"
        options:
          - "ReSukiSU"
          - "KernelSU Next"

      SUSFS:
        description: "Enable SuSFS (hide environment)"
        required: true
        type: boolean
        default: true

      optimization_profile:
        type: choice
        description: "Optimization profile"
        required: true
        default: "balanced"
        options:
          - "stock"
          - "safe"
          - "balanced"
          - "performance"

      lz4kd_enable:
        description: "LZ4KD ZRAM optimization"
        required: true
        type: boolean
        default: true

      bbr_enable:
        description: "TCP BBR (false=off, true=add, default=set as default)"
        required: true
        type: choice
        default: "true"
        options:
          - "false"
          - "true"
          - "default"

      baseband_guard:
        description: "Baseband Guard (anti-brick modem protection)"
        required: true
        type: boolean
        default: true

      wireguard:
        description: "WireGuard VPN support"
        required: true
        type: boolean
        default: true

      ip_set_enable:
        description: "IP_SET support (advanced firewall)"
        required: true
        type: boolean
        default: true

      ttl_enable:
        description: "TTL/HL Target (hide tethering from carrier)"
        required: true
        type: boolean
        default: true

      mem_opt_patches:
        description: "Memory/scheduler optimization patches"
        required: true
        type: boolean
        default: true

      zram_writeback:
        description: "ZRAM Writeback"
        required: true
        type: boolean
        default: true

      release:
        type: choice
        description: "Release mode (full LTO on Release)"
        required: true
        default: "Test"
        options:
          - "Release"
          - "Test-release"
          - "Test"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ${{ github.event.inputs.run_mode == 'github' && 'ubuntu-latest' || 'self-hosted' }}
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
      STOCK_STATUS: ${{ steps.export_status.outputs.STATUS }}
      KSU_COMMIT: ${{ steps.export_status.outputs.KSU_COMMIT }}
      SUS_COMMIT: ${{ steps.export_status.outputs.SUS_COMMIT }}

    steps:
      - name: Local runner special cleanup
        if: github.event.inputs.run_mode != 'github'
        run: |
          if [[ "${{ github.event.inputs.run_mode }}" == 'local_clear' ]]; then
            rm -rf ~/.repo ~/.repoconfig ~/vendor ~/device ~/snap ~/kernel_platform ~/out_boot ~/temporary
          else
            rm -rf ~/kernel_platform/common ~/kernel_platform/out ~/kernel_platform/KernelSU \
              ~/kernel_platform/susfs4ksu ~/kernel_platform/kernel_patches ~/out_boot \
              ~/kernel_platform/KernelSU-Next ~/kernel_platform/ReSukiSU
          fi

      - name: Show input parameters
        run: |
          {
            echo "## 🧾 Build Parameters"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| run_mode | ${{ inputs.run_mode }} |"
            echo "| android_release | ${{ inputs.android_release }} |"
            echo "| kernel_source | ${{ inputs.kernel_source }} |"
            echo "| google_kernel_ref | ${{ inputs.google_kernel_ref }} |"
            echo "| ksu_type | ${{ inputs.ksu_type }} |"
            echo "| SUSFS | ${{ inputs.SUSFS }} |"
            echo "| optimization_profile | ${{ inputs.optimization_profile }} |"
            echo "| lz4kd_enable | ${{ inputs.lz4kd_enable }} |"
            echo "| bbr_enable | ${{ inputs.bbr_enable }} |"
            echo "| baseband_guard | ${{ inputs.baseband_guard }} |"
            echo "| wireguard | ${{ inputs.wireguard }} |"
            echo "| ip_set_enable | ${{ inputs.ip_set_enable }} |"
            echo "| ttl_enable | ${{ inputs.ttl_enable }} |"
            echo "| mem_opt_patches | ${{ inputs.mem_opt_patches }} |"
            echo "| zram_writeback | ${{ inputs.zram_writeback }} |"
            echo "| release | ${{ inputs.release }} |"
            echo ""
            echo "> Timestamp: $(date)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove Unwanted Software
        if: github.event.inputs.run_mode == 'github'
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'false'
          remove-cached-tools: 'true'
          verbose: 'false'

      - name: Further cleanup
        if: github.event.inputs.run_mode == 'github'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get purge -y aria2 ansible azure-cli shellcheck rpm xorriso zsync \
            esl-erlang firefox gfortran-8 gfortran-9 google-chrome-stable \
            google-cloud-sdk imagemagick libmagickcore-dev libmagickwand-dev \
            libmagic-dev ant ant-optional kubectl mercurial apt-transport-https \
            mono-complete libmysqlclient unixodbc-dev yarn chrpath libssl-dev \
            libxft-dev libfreetype6 libfreetype6-dev libfontconfig1 libfontconfig1-dev \
            snmp pollinate libpq-dev postgresql-client powershell ruby-full \
            sphinxsearch subversion mongodb-org microsoft-edge-stable || true
          sudo apt-get purge -y $(dpkg-query -W -f='${binary:Package}\n' | grep -E '^mysql|^php|^dotnet') || true
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          df -h

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.WORK_NAME || 'github-actions' }}"
          git config --global user.email "${{ secrets.WORK_EMAIL || 'github-actions@users.noreply.github.com' }}"

      - name: Install dependencies
        if: github.event.inputs.run_mode == 'github'
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            git curl build-essential bc bison flex libssl-dev libelf-dev \
            python3-pip zip wget aria2 dos2unix pahole

      - name: Install repo tool
        if: github.event.inputs.run_mode == 'github'
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Resolve device / kernel / Android matrix
        run: |
          set -euo pipefail
          ANDROID="${{ inputs.android_release }}"
          SOURCE="${{ inputs.kernel_source }}"
          REF="${{ inputs.google_kernel_ref }}"

          case "$ANDROID" in
            android12) GOOGLE_BRANCH="android12-5.10" ;;
            android13) GOOGLE_BRANCH="android13-5.10" ;;
            android14) GOOGLE_BRANCH="android14-5.10" ;;
            android15) GOOGLE_BRANCH="android15-5.10" ;;
            android16) GOOGLE_BRANCH="android16-5.10" ;;
            *) echo "::error::Unsupported Android line"; exit 1 ;;
          esac

          if [[ "$REF" != "latest" && -n "$REF" ]]; then
            GOOGLE_BRANCH="$REF"
          fi

          echo "TARGET_PLATFORM=sm7475" >> "$GITHUB_ENV"
          echo "KERNEL_FAMILY=5.10" >> "$GITHUB_ENV"
          echo "KERNEL_BASE=$SOURCE" >> "$GITHUB_ENV"
          echo "GOOGLE_KERNEL_REF=$GOOGLE_BRANCH" >> "$GITHUB_ENV"
          echo "ANDROID_LINE=$ANDROID" >> "$GITHUB_ENV"
          echo "Resolved Google branch: $GOOGLE_BRANCH"

      - name: Sync Google / Realme kernel sources
        run: |
          set -euo pipefail
          rm -rf ~/kernel_platform ~/realme_vendor_kernel
          if [[ "${{ inputs.kernel_source }}" == "google_5_10_realme" ]]; then
            git clone --filter=blob:none --no-checkout "${GOOGLE_COMMON_REPO}" ~/kernel_platform
            cd ~/kernel_platform
            git fetch --depth=1 origin "${GOOGLE_KERNEL_REF}"
            git checkout --detach FETCH_HEAD

            git clone --filter=blob:none --no-checkout "${REALME_NEO5SE_KERNEL}" ~/realme_vendor_kernel
            cd ~/realme_vendor_kernel
            git fetch --depth=1 origin HEAD
            git checkout --detach FETCH_HEAD
          else
            git clone --depth=1 "${REALME_NEO5SE_KERNEL}" ~/kernel_platform
          fi

      - name: Apply GT Neo5 SE Google 5.10 patch catalog
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          PATCH_ROOT="${GITHUB_WORKSPACE}/kernel-ports/gt_neo5se/5.10/${{ inputs.android_release }}"
          MANIFEST="${PATCH_ROOT}/series"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "::warning::Patch series not found at $MANIFEST — skipping port patches (expected if kernel-ports is not present in this repo)"
            exit 0
          fi

          while IFS= read -r patch; do
            [[ -z "$patch" || "$patch" =~ ^[[:space:]]*# ]] && continue
            patch_path="${PATCH_ROOT}/${patch}"
            [[ -f "$patch_path" ]] || {
              echo "::error::Missing patch listed in series: $patch"
              exit 1
            }
            git apply --check --3way "$patch_path" || true
            git am --3way --keep-cr "$patch_path" || git apply --3way "$patch_path" || true
          done < "$MANIFEST"

      - name: Validate Realme vendor compatibility
        run: |
          set -euo pipefail
          CHECK="${GITHUB_WORKSPACE}/kernel-ports/gt_neo5se/5.10/${{ inputs.android_release }}/compatibility-check.sh"
          if [[ -x "$CHECK" ]]; then
            "$CHECK" ~/realme_vendor_kernel ~/kernel_platform || true
          else
            echo "::warning::Compatibility checker missing — skipping"
          fi

      - name: Export kernel port metadata
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          {
            echo "GOOGLE_KERNEL_REF=${GOOGLE_KERNEL_REF}"
            echo "GOOGLE_KERNEL_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "REALME_VENDOR_SOURCE=${REALME_NEO5SE_KERNEL}"
            echo "TARGET_PLATFORM=sm7475"
            echo "ANDROID_LINE=${{ inputs.android_release }}"
          } >> "$GITHUB_ENV"

      - name: Apply optimization profile
        run: |
          set -euo pipefail
          cd ~/kernel_platform

          if [[ -f ./common/arch/arm64/configs/gki_defconfig ]]; then
            CONFIG="./common/arch/arm64/configs/gki_defconfig"
          elif [[ -f ./arch/arm64/configs/gki_defconfig ]]; then
            CONFIG="./arch/arm64/configs/gki_defconfig"
          else
            echo "::warning::gki_defconfig not found; skipping profile"
            exit 0
          fi

          add_cfg() {
            local key="$1" value="$2"
            grep -q "^${key}=" "$CONFIG" || echo "${key}=${value}" >> "$CONFIG"
          }

          case "${{ inputs.optimization_profile }}" in
            stock) ;;
            safe)
              add_cfg CONFIG_TCP_CONG_BBR y
              add_cfg CONFIG_NET_SCH_FQ y
              add_cfg CONFIG_ZRAM y
              add_cfg CONFIG_ZSMALLOC y
              ;;
            balanced|performance)
              add_cfg CONFIG_TCP_CONG_ADVANCED y
              add_cfg CONFIG_TCP_CONG_BBR y
              add_cfg CONFIG_NET_SCH_FQ y
              add_cfg CONFIG_NET_SCH_FQ_CODEL y
              add_cfg CONFIG_ZRAM y
              add_cfg CONFIG_ZSMALLOC y
              add_cfg CONFIG_ZRAM_WRITEBACK y
              ;;
          esac
          echo "Optimization profile: ${{ inputs.optimization_profile }}"

      - name: Download stock boot.img & AnyKernel3
        if: github.event.inputs.run_mode == 'github'
        run: |
          cd ~/
          mkdir -p ~/stock_boot ~/boot ~/out_boot
          pip install --quiet gdown || true
          gdown --id 1PtSKw3jEZSyE1MhvzeUwy30wwv7D8_bQ -O stock_boot/boot.img || \
            echo "::warning::gdown stock boot.img failed — continue without it"
          git clone https://github.com/WildPlusKernel/AnyKernel3.git -b gki-2.0 --depth=1 --no-tags || \
            git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 --no-tags

      - name: Modify Oplus build script
        if: github.event.inputs.run_mode != 'local'
        run: |
          if [[ -f ~/kernel_platform/oplus/build/oplus_build_kernel.sh ]]; then
            cd ~/kernel_platform/oplus/build/
            sed -i '/init_environment/s/ \$1 \$2/ \$1 \$2 \$3 \$4 \$5/' oplus_build_kernel.sh || true
            sed -i '/oplus_setup.sh/s/ \$1 \$2/ \$1 \$2 \$3 \$4 \$5/' oplus_build_kernel.sh || true
          else
            echo "::warning::oplus_build_kernel.sh not found"
          fi

      - name: Create build helpers
        run: |
          cat > ~/start.sh << 'EOF'
          #!/bin/bash
          set -e
          cd ~/
          LTO_MODE="thin"
          if [[ "${{ inputs.release }}" == "Release" ]]; then
            LTO_MODE="full"
          fi
          SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh \
            "${TARGET_PLATFORM:-sm7475}" gki "$LTO_MODE" all disable
          echo " >>> BUILD DONE <<< "
          EOF
          chmod a+x ~/start.sh

          cat > ~/make_out.sh << 'EOF'
          #!/bin/bash
          set -e
          NAME="${1:-kernel}"
          cd ~/ && ./start.sh
          echo " >>> PACKAGING: $NAME <<<"

          mkdir -p ~/out_boot ~/boot
          if [[ -f ~/kernel_platform/out/msm-waipio-waipio-gki/dist/boot.img ]]; then
            cp ~/kernel_platform/out/msm-waipio-waipio-gki/dist/boot.img ~/boot/ || true
          fi

          # Repack boot if possible
          if [[ -f ~/kernel_platform/oplus/build/oplus_build_repack_bootimg.sh ]] && \
             [[ -f ~/boot/boot.img ]] && [[ -f ~/stock_boot/boot.img ]]; then
            ./kernel_platform/oplus/build/oplus_build_repack_bootimg.sh \
              -k ~/boot/boot.img -r ~/stock_boot/boot.img -o ~/out_boot/ || true
            mv ~/out_boot/repacked-boot.img ~/out_boot/${NAME}_boot.img 2>/dev/null || true
          fi

          # AnyKernel3
          if [[ -d ~/AnyKernel3 ]]; then
            cd ~/AnyKernel3
            IMAGE_CANDIDATES=(
              ~/kernel_platform/out/msm-waipio-waipio-gki/gki_kernel/dist/Image
              ~/kernel_platform/out/arch/arm64/boot/Image
              ~/kernel_platform/out/*/dist/Image
            )
            for img in "${IMAGE_CANDIDATES[@]}"; do
              if [[ -f $img ]]; then
                cp "$img" ~/AnyKernel3/Image
                break
              fi
            done
            if [[ -f Image ]]; then
              zip -r "../AnyKernel3_${NAME}.zip" ./*
              mv ~/AnyKernel3_${NAME}.zip ~/out_boot/ || true
              cp Image ~/out_boot/Image_${NAME} || true
              STATUS=SUCCESS
            else
              STATUS=FAILED
            fi
          else
            STATUS=FAILED
          fi

          echo "Build >>> $STATUS <<<"
          echo "${NAME}_STATUS=${STATUS}" >> "$GITHUB_ENV"
          echo "STATUS=${STATUS}" >> "$GITHUB_ENV"

          # Collect rejects
          mkdir -p ~/rej/${NAME}/
          find ~/kernel_platform -type f -name '*.rej' 2>/dev/null | while read -r FILE; do
            dir=${FILE#*/kernel_platform/}; dir=${dir%/*}/
            file=${FILE##*/}
            mkdir -p "~/rej/${NAME}/$dir"
            cp "$FILE" "~/rej/${NAME}/$dir/$file" 2>/dev/null || true
          done
          echo " >>> DONE <<< "
          EOF
          chmod a+x ~/make_out.sh

      - name: Change Kernel Name / UTS
        run: |
          cd ~/kernel_platform
          MOD_VER="Stock"
          echo "MOD_VER=$MOD_VER" >> "$GITHUB_ENV"

          DATESTR=$(date -u)
          for f in ./common/scripts/mkcompile_h ./msm-kernel/scripts/mkcompile_h; do
            [[ -f "$f" ]] || continue
            perl -pi -e "s{UTS_VERSION=\"\\\$\\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f" || true
          done

          for f in ./common/scripts/setlocalversion ./msm-kernel/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do
            [[ -f "$f" ]] || continue
            sed -i 's/-dirty//' "$f" || true
            tac "$f" | sed '0,/echo "\$res"/s//res=\$(echo \$res | cut -d- -f1-2)-QTARO-1.0-${MOD_VER};echo "\$res";/' | tac > "${f}.tmp" && mv "${f}.tmp" "$f"
            chmod +x "$f"
          done

      # ─────────────────────── Root solution setup ───────────────────────
      - name: ⚡ Setup ReSukiSU
        if: inputs.ksu_type == 'ReSukiSU'
        id: ksu_version
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          # Prefer common/ tree if present (Google GKI layout)
          ROOT_DIR="."
          [[ -d common ]] && ROOT_DIR="common"

          echo "🛠️ Setting up ReSukiSU (main)..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

          # Locate KernelSU dir
          KSU_DIR=""
          for d in KernelSU ReSukiSU kernel/KernelSU; do
            if [[ -d "$ROOT_DIR/$d" ]]; then KSU_DIR="$ROOT_DIR/$d"; break; fi
            if [[ -d "$d" ]]; then KSU_DIR="$d"; break; fi
          done
          if [[ -z "$KSU_DIR" ]]; then
            echo "::error::ReSukiSU directory not found after setup"
            exit 1
          fi

          cd "$KSU_DIR"
          KSU_VERSION_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          # ReSukiSU / BakaSu version base similar to other forks
          KSUVER=$(expr ${KSU_VERSION_COUNT} + 37185 2>/dev/null || echo "unknown")
          COMMIT=$(git rev-parse HEAD)
          echo "KSUVER=$KSUVER" >> "$GITHUB_ENV"
          echo "KSU_COMMIT=https://github.com/ReSukiSU/ReSukiSU/commit/$COMMIT" >> "$GITHUB_ENV"
          echo "ksuver=$KSUVER" >> "$GITHUB_OUTPUT"
          echo "✅ ReSukiSU $(git rev-parse --short HEAD) (ver $KSUVER)"

          MOD_VER="ReSukiSU_v${KSUVER}"
          echo "MOD_VER=$MOD_VER" >> "$GITHUB_ENV"

      - name: ⚡ Setup KernelSU-Next
        if: inputs.ksu_type == 'KernelSU Next'
        id: ksu_version
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          ROOT_DIR="."
          [[ -d common ]] && ROOT_DIR="common"

          echo "🛠️ Setting up KernelSU-Next..."
          # Prefer pershoot/dev-susfs if SUSFS is requested, otherwise upstream
          if [[ "${{ inputs.SUSFS }}" == "true" ]]; then
            git clone --filter=blob:none -b dev-susfs \
              https://github.com/pershoot/KernelSU-Next.git KernelSU-Next || \
            git clone --filter=blob:none \
              https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          else
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next || \
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" | bash -
          fi

          KSU_DIR=""
          for d in KernelSU-Next KernelSU; do
            if [[ -d "$ROOT_DIR/$d" ]]; then KSU_DIR="$ROOT_DIR/$d"; break; fi
            if [[ -d "$d" ]]; then KSU_DIR="$d"; break; fi
          done
          if [[ -z "$KSU_DIR" ]]; then
            echo "::error::KernelSU-Next directory not found"
            exit 1
          fi

          cd "$KSU_DIR"
          KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          KSUVER=$(expr 10000 + ${KSU_GIT_VERSION} + 200 2>/dev/null || echo "unknown")
          COMMIT=$(git rev-parse HEAD)
          echo "KSUVER=$KSUVER" >> "$GITHUB_ENV"
          echo "KSU_COMMIT=https://github.com/KernelSU-Next/KernelSU-Next/commit/$COMMIT" >> "$GITHUB_ENV"
          echo "ksuver=$KSUVER" >> "$GITHUB_OUTPUT"
          echo "✅ KernelSU-Next $(git rev-parse --short HEAD) (ver $KSUVER)"

          # Wire into drivers if needed (Google layout)
          if [[ -d ~/kernel_platform/common/drivers ]]; then
            cd ~/kernel_platform/common
            ln -sfn "$(realpath --relative-to=drivers "$PWD/../KernelSU-Next/kernel" 2>/dev/null || echo ../KernelSU-Next/kernel)" drivers/kernelsu 2>/dev/null || true
            grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile || true
            grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
              sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig || true
          fi

          MOD_VER="KSUN_v${KSUVER}"
          echo "MOD_VER=$MOD_VER" >> "$GITHUB_ENV"

      # ─────────────────────── Patches & SuSFS ───────────────────────
      - name: 🔧 Clone patch repositories
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          git clone --depth=1 https://github.com/WildPlusKernel/kernel_patches.git kernel_patches &
          git clone --depth=1 https://github.com/TheWildJames/kernel_patches.git wild_patches &
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git SukiSU_patch &
          if [[ "${{ inputs.SUSFS }}" == "true" ]]; then
            # 5.10 GKI branch
            git clone --depth=1 -b gki-android12-5.10 \
              https://gitlab.com/simonpunk/susfs4ksu.git &
          fi
          wait
          echo "✅ Patch repos ready"

      - name: 📦 Apply SuSFS
        if: inputs.SUSFS
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          ROOT_DIR="."
          [[ -d common ]] && ROOT_DIR="common"

          # Copy SuSFS sources
          if [[ -d susfs4ksu/kernel_patches/fs ]]; then
            cp -r susfs4ksu/kernel_patches/fs/* "$ROOT_DIR/fs/" || true
            cp -r susfs4ksu/kernel_patches/include/* "$ROOT_DIR/include/" || true
          fi

          # Kernel patch
          SUS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"
          if [[ -f "$SUS_PATCH" ]]; then
            cp "$SUS_PATCH" "$ROOT_DIR/"
            (cd "$ROOT_DIR" && patch -p1 --forward < 50_add_susfs_in_gki-android12-5.10.patch) || \
              echo "::warning::SuSFS kernel patch had rejects (continuing)"
          fi

          # Enable SuSFS inside the chosen root solution
          if [[ "${{ inputs.ksu_type }}" == "KernelSU Next" ]]; then
            KSU_PATCH_DIR="KernelSU-Next"
            [[ -d "$ROOT_DIR/KernelSU-Next" ]] && KSU_PATCH_DIR="$ROOT_DIR/KernelSU-Next"
            if [[ -f susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]]; then
              cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "$KSU_PATCH_DIR/" || true
              (cd "$KSU_PATCH_DIR" && patch -p1 --forward < 10_enable_susfs_for_ksu.patch) || \
                echo "::warning::SuSFS→KSUN enable patch had rejects"
            fi
          elif [[ "${{ inputs.ksu_type }}" == "ReSukiSU" ]]; then
            # ReSukiSU usually has better native SuSFS integration; still apply if present
            KSU_PATCH_DIR="KernelSU"
            [[ -d "$ROOT_DIR/KernelSU" ]] && KSU_PATCH_DIR="$ROOT_DIR/KernelSU"
            if [[ -f susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]]; then
              cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "$KSU_PATCH_DIR/" || true
              (cd "$KSU_PATCH_DIR" && patch -p1 --forward < 10_enable_susfs_for_ksu.patch) || true
            fi
          fi

          # Extra hide patch
          if [[ -f kernel_patches/69_hide_stuff.patch ]]; then
            (cd "$ROOT_DIR" && patch -p1 --fuzz=3 -F3 < ../kernel_patches/69_hide_stuff.patch) || true
          fi

          # Record SuSFS commit
          if [[ -d susfs4ksu ]]; then
            COMMIT=$(cd susfs4ksu && git rev-parse HEAD)
            echo "SUS_COMMIT=https://gitlab.com/simonpunk/susfs4ksu/-/commit/$COMMIT" >> "$GITHUB_ENV"
          fi

          # Update name
          MOD_VER="${MOD_VER}_SUSFS_${SUSFS_VERSION}"
          echo "MOD_VER=$MOD_VER" >> "$GITHUB_ENV"
          echo "✅ SuSFS applied"

      - name: ⚙️ Configure Kernel Options (gki_defconfig)
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          if [[ -f ./common/arch/arm64/configs/gki_defconfig ]]; then
            DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"
          else
            DEFCONFIG="./arch/arm64/configs/gki_defconfig"
          fi
          [[ -f "$DEFCONFIG" ]] || { echo "::error::gki_defconfig missing"; exit 1; }

          echo "CONFIG_KSU=y" >> "$DEFCONFIG"

          case "${{ inputs.ksu_type }}" in
            "ReSukiSU")
              # ReSukiSU / BakaSu typically uses manual / full name format
              echo 'CONFIG_KSU_FULL_NAME_FORMAT="v%KSU_VERSION%-%COMMIT_SHA%"' >> "$DEFCONFIG" || true
              ;;
            "KernelSU Next")
              echo "CONFIG_KSU_KPROBES_HOOK=n" >> "$DEFCONFIG" || true
              echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG" || true
              ;;
          esac

          # Common useful options
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          echo "CONFIG_MODULE_SIG=n" >> "$DEFCONFIG"

          # SuSFS options
          if [[ "${{ inputs.SUSFS }}" == "true" ]]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
            # Magic mount: prefer y for Next / ReSukiSU
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$DEFCONFIG"
          fi

          # LZ4KD / ZRAM
          if [[ "${{ inputs.lz4kd_enable }}" == "true" ]]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_CRYPTO_LZO=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_CRYPTO_LZ4K=y
          CONFIG_CRYPTO_LZ4KD=y
          CONFIG_CRYPTO_842=y
          CONFIG_CRYPTO_LZ4K_OPLUS=y
          EOF
          fi
          if [[ "${{ inputs.zram_writeback }}" == "true" ]]; then
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$DEFCONFIG"
          fi

          # BBR
          if [[ "${{ inputs.bbr_enable }}" != "false" ]]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          EOF
            if [[ "${{ inputs.bbr_enable }}" == "default" ]]; then
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> "$DEFCONFIG"
            fi
          fi

          # IP_SET
          if [[ "${{ inputs.ip_set_enable }}" == "true" ]]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          EOF
          fi

          # TTL / HL
          if [[ "${{ inputs.ttl_enable }}" == "true" ]]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          EOF
          fi

          # WireGuard
          if [[ "${{ inputs.wireguard }}" == "true" ]]; then
            echo "CONFIG_WIREGUARD=y" >> "$DEFCONFIG" || true
          fi

          # Baseband Guard
          if [[ "${{ inputs.baseband_guard }}" == "true" ]]; then
            echo "CONFIG_BBG=y" >> "$DEFCONFIG"
          fi

          # Remove check_defconfig if present
          sed -i 's/check_defconfig//' ./common/build.config.gki 2>/dev/null || true
          sed -i 's/check_defconfig//' ./build.config.gki 2>/dev/null || true

          echo "✅ gki_defconfig updated"

      - name: Apply LZ4KD / ZRAM patches
        if: inputs.lz4kd_enable
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          ROOT_DIR="."
          [[ -d common ]] && ROOT_DIR="common"

          if [[ -d SukiSU_patch/other/zram ]]; then
            cp -r SukiSU_patch/other/zram/lz4k/* "$ROOT_DIR/" 2>/dev/null || true
            cp -r SukiSU_patch/other/zram/zram_patch/5.10/* "$ROOT_DIR/" 2>/dev/null || true
            cp -r SukiSU_patch/other/zram/lz4k_oplus "$ROOT_DIR/lib/" 2>/dev/null || true
            (cd "$ROOT_DIR" && patch -p1 < lz4kd.patch) || true
            (cd "$ROOT_DIR" && patch -p1 < lz4k_oplus.patch) || true
          fi
          # Clear gki modules list to avoid integrity issues
          rm -f "$ROOT_DIR/android/gki_aarch64_modules" 2>/dev/null || true
          touch "$ROOT_DIR/android/gki_aarch64_modules" 2>/dev/null || true
          echo "✅ LZ4KD applied"

      - name: Apply memory / scheduler optimization patches
        if: inputs.mem_opt_patches
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          ROOT_DIR="."
          [[ -d common ]] && ROOT_DIR="common"

          apply() {
            local p="$1"
            if [[ -f "$p" ]]; then
              (cd "$ROOT_DIR" && patch -p1 --forward -F3 < "../$p") && echo "✅ $(basename $p)" || echo "⚠️ $(basename $p) skipped"
            fi
          }

          # From TheWildJames / WildPlusKernel
          apply wild_patches/gki_ptrace.patch
          apply wild_patches/common/optimized_mem_operations.patch
          apply wild_patches/common/file_struct_8bytes_align.patch
          apply wild_patches/common/reduce_cache_pressure.patch
          apply wild_patches/common/clear_page_16bytes_align.patch
          apply kernel_patches/gki_ptrace.patch
          apply kernel_patches/common/optimized_mem_operations.patch
          apply kernel_patches/common/file_struct_8bytes_align.patch
          apply kernel_patches/common/reduce_cache_pressure.patch
          apply kernel_patches/common/clear_page_16bytes_align.patch
          echo "✅ Memory/scheduler patches done"

      - name: Apply Baseband Guard
        if: inputs.baseband_guard
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          ROOT_DIR="."
          [[ -d common ]] && ROOT_DIR="common"
          if ! wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash; then
            echo "::warning::BBG setup script failed, continuing"
          fi
          # Also try alternate
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash || true

          # LSM default
          if [[ -f "$ROOT_DIR/security/Kconfig" ]]; then
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' \
              "$ROOT_DIR/security/Kconfig" || true
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
              "$ROOT_DIR/security/Kconfig" || true
          fi
          echo "✅ Baseband Guard configured"

      - name: Apply manual hooks (KernelSU-Next)
        if: inputs.ksu_type == 'KernelSU Next'
        run: |
          set -euo pipefail
          cd ~/kernel_platform
          ROOT_DIR="."
          [[ -d common ]] && ROOT_DIR="common"
          if [[ -f kernel_patches/next/scope_min_manual_hooks_v1.4.patch ]]; then
            cp kernel_patches/next/scope_min_manual_hooks_v1.4.patch "$ROOT_DIR/"
            (cd "$ROOT_DIR" && patch -p1 < scope_min_manual_hooks_v1.4.patch) || \
              echo "::warning::manual hooks patch had rejects"
          fi
          echo "✅ Manual hooks applied"

      - name: Disk Space Before Build
        run: df -h

      - name: 🔨 Build Kernel
        id: build_kernel
        run: |
          set -euo pipefail
          cd ~/
          ./make_out.sh "${{ inputs.ksu_type == 'ReSukiSU' && 'ReSukiSU' || 'KSUN' }}${{ inputs.SUSFS && '_SUS' || '' }}"
          echo "STATUS=${STATUS:-UNKNOWN}" >> "$GITHUB_ENV"

      - name: Export status
        if: always()
        id: export_status
        run: |
          echo "STATUS=${STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "KSU_COMMIT=${KSU_COMMIT:-}" >> "$GITHUB_OUTPUT"
          echo "SUS_COMMIT=${SUS_COMMIT:-}" >> "$GITHUB_OUTPUT"

      - name: Disk Space after Build
        run: df -h

      - name: Check output files
        run: |
          echo "=== out_boot ==="
          ls -lh ~/out_boot/ 2>/dev/null || echo "(empty)"
          echo "=== Image candidates ==="
          find ~/kernel_platform/out -name Image -type f 2>/dev/null | head -10 || true

      - name: Upload AnyKernel3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anykernel_${{ inputs.ksu_type }}${{ inputs.SUSFS && '_SUSFS' || '' }}
          path: ~/out_boot/*.zip
          if-no-files-found: warn

      - name: Upload Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images_${{ inputs.ksu_type }}${{ inputs.SUSFS && '_SUSFS' || '' }}
          path: ~/out_boot/Image*
          if-no-files-found: warn

      - name: Upload boot.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot_${{ inputs.ksu_type }}${{ inputs.SUSFS && '_SUSFS' || '' }}
          path: ~/out_boot/*.img
          if-no-files-found: warn

      - name: Upload rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rej_${{ inputs.ksu_type }}${{ inputs.SUSFS && '_SUSFS' || '' }}
          path: ~/rej/**/*
          if-no-files-found: ignore

      - name: Show results summary
        if: always()
        run: |
          build_status() {
            case "$1" in
              SUCCESS) echo "✅" ;;
              FAILED)  echo "❌" ;;
              *)       echo "⏭️" ;;
            esac
          }
          {
            echo "## 🧾 Build Results"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Root solution | ${{ inputs.ksu_type }} |"
            echo "| SuSFS | ${{ inputs.SUSFS }} (${SUSFS_VERSION}) |"
            echo "| Version | ${KSUVER:-—} |"
            echo "| Status | $(build_status ${STATUS:-}) |"
            echo "| KSU commit | ${KSU_COMMIT:-—} |"
            echo "| SuSFS commit | ${SUS_COMMIT:-—} |"
            echo "| Google branch | ${GOOGLE_KERNEL_REF} |"
            echo "| Release mode | ${{ inputs.release }} |"
            echo ""
            echo "> Timestamp: $(date)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  trigger-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.release != 'Test' }}
    permissions:
      contents: write
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tag
        run: |
          BASE="v1.0-r0"
          LAST=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[].name' 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$LAST" ]; then LAST="$BASE"; fi
          if [[ "${{ github.event.inputs.release }}" == 'Release' ]]; then
            NEW_TAG=$(echo "$LAST" | awk -F'-r' '{n=$2+1; printf "%s-r%d", $1, n}')
            echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
            git tag "$NEW_TAG" || true
            git push origin "refs/tags/${NEW_TAG}" || true
          else
            NEW_TAG="${LAST}-t${GITHUB_RUN_NUMBER}"
            echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          fi
          echo "NEW TAG: $NEW_TAG"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: anykernel_*
          merge-multiple: true

      - name: Build release notes
        run: |
          cat << EOF > release.md
          # 🎯 Realme GT Neo5 SE — ${{ inputs.ksu_type }}${{ inputs.SUSFS && ' + SuSFS' || '' }}

          > **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          > **Build ID:** \`${{ github.run_id }}\`
          > **Tag:** \`${{ env.NEW_TAG }}\`

          **IMPORTANT DISCLAIMER**  
          This software is provided for testing and educational purposes only. Use at your own risk.

          ## Build info
          | Item | Value |
          |------|-------|
          | Root solution | ${{ inputs.ksu_type }} |
          | SuSFS | ${{ inputs.SUSFS }} (${{ env.SUSFS_VERSION }}) |
          | KSU version | ${{ needs.build.outputs.ksuver }} |
          | Android line | ${{ inputs.android_release }}-5.10 |
          | Optimization | ${{ inputs.optimization_profile }} |
          | LTO | $([ "${{ inputs.release }}" = "Release" ] && echo "Full" || echo "Thin") |
          | LZ4KD | ${{ inputs.lz4kd_enable }} |
          | BBR | ${{ inputs.bbr_enable }} |
          | Baseband Guard | ${{ inputs.baseband_guard }} |
          | WireGuard | ${{ inputs.wireguard }} |
          | IP_SET | ${{ inputs.ip_set_enable }} |
          | TTL/HL | ${{ inputs.ttl_enable }} |
          | Mem-opt patches | ${{ inputs.mem_opt_patches }} |
          | ZRAM writeback | ${{ inputs.zram_writeback }} |

          ### Managers
          - [ReSukiSU](https://github.com/ReSukiSU/ReSukiSU/releases)
          - [KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)

          Latest SuSFS module: https://github.com/sidex15/ksu_module_susfs/releases
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: ${{ inputs.release == 'Test-release' }}
          name: GT Neo5 SE ${{ inputs.ksu_type }}${{ inputs.SUSFS && ' + SuSFS' || '' }} ${{ env.NEW_TAG }}
          body_path: release.md
          files: artifacts/*.zip
